<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 21: Table</title>
  </head>
  <body>
    <h1>Table exercise</h1>
    <table>
      <thead>
        <tr>
          <th>Product name</th>
          <th>Product price</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>T-shirt</td>
          <td>100 Euro</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Jeans</td>
          <td>200 Euro</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Sneakers</td>
          <td>300 Euro</td>
          <td>30</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Remark</td>
          <td colspan="2">Just count the products that still in stock</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
